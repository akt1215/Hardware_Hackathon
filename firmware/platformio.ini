; Hardware_Hackathon — IMU streamer for the wall-rally game.
;
; Emits one serial JSON frame per sample matching the team data contract
; (imu.accelerometer_g / imu.gyroscope_dps). The host bridge forwards it to the
; browser over WebSocket.
;
;   pio run -e native            # laptop sim (synthetic rally swings)
;   pio run -e nucleo_g474re     # real STM32 + MPU-6050
;   pio run -e nucleo_g474re -t upload

[env:nucleo_g474re]
platform = ststm32
board = nucleo_g474re
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit MPU6050
; Host-only sim libs must not compile for the target.
lib_ignore =
    ArduinoCompat
    VirtualKit

; Laptop simulation: same src/main.cpp, virtual MPU-6050 in the rally scene.
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -D SIM_FIRMWARE
    -D VK_SCENE_RALLY
lib_ldf_mode = deep+
