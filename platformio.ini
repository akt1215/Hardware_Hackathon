; PlatformIO project configuration
; NYTECHWEEK Hardware Hack — "The World is Your Controller"
; Board confirmed: STM32 Nucleo-G474RE (Cortex-M4 @ 170MHz).
; Local flash/sanity path. Primary firmware dev goes through Seb (Hideout).
;
; Build:  pio run        Flash:  pio run -t upload        Monitor:  pio device monitor

[env:nucleo_g474re]
platform = ststm32
board = nucleo_g474re
framework = arduino

; ST-Link is the on-board probe on the Nucleo.
upload_protocol = stlink
debug_tool = stlink

; Serial monitor speed (matches Serial.begin in main.cpp)
monitor_speed = 115200

; Kit libraries (Servo is bundled in the STM32 Arduino core).
; Adafruit MPU6050 pulls in Adafruit BusIO + Unified Sensor.
lib_deps =
    adafruit/Adafruit MPU6050
